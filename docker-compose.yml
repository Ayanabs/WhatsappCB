services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-countdown-bot
    container_name: whatsapp-countdown-bot
    restart: unless-stopped

    # Reaps Chromium child processes so they don't pile up as zombies
    init: true

    ports:
      # The container listens on the same ports it publishes, so the dashboard's
      # API address (host + API_PORT) is correct. Set BIND_IP=127.0.0.1 to keep the
      # ports private to the server (e.g. behind a reverse proxy or SSH tunnel).
      # API & WebSocket backend
      - "${BIND_IP:-0.0.0.0}:${API_PORT:-5150}:${API_PORT:-5150}"
      # Web HUD Dashboard frontend
      - "${BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-5151}:${FRONTEND_PORT:-5151}"

    environment:
      - API_PORT=${API_PORT:-5150}
      - FRONTEND_PORT=${FRONTEND_PORT:-5151}
      - WORKER_INTERVAL_MS=${WORKER_INTERVAL_MS:-5000}
      # Public address of the API when it is not reachable at http://<host>:API_PORT
      # (for example https://bot.example.com behind a reverse proxy)
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - TZ=${TZ:-Asia/Colombo}

    volumes:
      # WhatsApp session — persists your QR scan across container restarts
      - wa_session:/app/.wwebjs_auth

      # Bot configuration (config.json — all HUD settings, approval-auth.json)
      - bot_data:/app/data

      # Uploaded media files and saved posters (videos, images, audio)
      - bot_uploads:/app/uploads

      # logs/bot.log — delivery and connection log
      - bot_logs:/app/logs

    # Shared memory: prevents Chromium from crashing inside Docker
    shm_size: '1gb'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes — managed by Docker, survive `docker compose down`
volumes:
  wa_session:
    driver: local
  bot_data:
    driver: local
  bot_uploads:
    driver: local
  bot_logs:
    driver: local
