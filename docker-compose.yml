services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-automation-bot
    restart: unless-stopped

    ports:
      # API & WebSocket backend
      - "${API_PORT:-5150}:5150"
      # Web HUD Dashboard frontend
      - "${FRONTEND_PORT:-5151}:5151"

    environment:
      - API_PORT=${API_PORT:-5150}
      - FRONTEND_PORT=${FRONTEND_PORT:-5151}
      - WORKER_INTERVAL_MS=${WORKER_INTERVAL_MS:-5000}

    volumes:
      # WhatsApp session — persists your QR scan across container restarts
      - wa_session:/app/.wwebjs_auth

      # Bot configuration (config.json — all HUD settings)
      - bot_data:/app/data

      # Uploaded media files (videos, images, audio)
      - bot_uploads:/app/uploads

    # Shared memory: prevents Chromium from crashing inside Docker
    shm_size: '256mb'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes — managed by Docker, survive `docker compose down`
volumes:
  wa_session:
    driver: local
  bot_data:
    driver: local
  bot_uploads:
    driver: local
